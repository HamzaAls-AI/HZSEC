name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm_script: dist:win
          - os: macos-latest
            npm_script: dist:mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CSC_LINK / CSC_KEY_PASSWORD omitted intentionally — passing an empty
          # string when the secret is unset causes electron-builder to treat it
          # as a file path and crash. Add these back once signing certs are ready.
          # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD likewise omitted until cert is ready.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.npm_script }} -- --publish always
