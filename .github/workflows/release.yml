name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm_script: dist:win
            asset_glob: "dist/*.exe"
            stable_name: HZSec-Setup.exe
          - os: macos-latest
            npm_script: dist:mac
            asset_glob: "dist/*.dmg"
            stable_name: HZSec-arm64.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.npm_script }} -- --publish never

      - name: Upload to release with stable name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          # Create draft release if it doesn't exist yet
          gh release view "$TAG" --json tagName 2>/dev/null \
            || gh release create "$TAG" --draft --title "$TAG" --notes ""

          # Find the artifact and upload with stable name
          ARTIFACT=$(ls ${{ matrix.asset_glob }} | head -1)
          cp "$ARTIFACT" "dist/${{ matrix.stable_name }}"
          gh release upload "$TAG" "dist/${{ matrix.stable_name }}" --clobber
